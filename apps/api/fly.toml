# fly.toml app configuration file generated for api-empty-grass-3771 on 2026-07-02T16:06:09+10:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'api-empty-grass-3771'
primary_region = 'syd'

[build]

[env]
  PORT = '3000'
  DB_PATH = '/data/marrakech.db'
  ONLINE_DB_PATH = '/data/online.db'
  WEB_ORIGIN = 'https://marrakech-web-api-xnnv.vercel.app'

[[mounts]]
  source = 'marrakech_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
